name: Build and publish Home Assistant image

on:
  push:
    branches:
      - main
    paths:
      - "bookorbit/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-bookorbit-ha
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version="$(python - <<'PY'
          import yaml
          with open('bookorbit/config.yaml', encoding='utf-8') as f:
              print(yaml.safe_load(f)['version'])
          PY
          )"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build validation image
        run: docker build --pull --tag bookorbit-ha-publish-test ./bookorbit

      - name: Verify Pi-safe large-file hook
        run: |
          set -eu
          docker run --rm \
            -e NODE_OPTIONS=--require=/app/ha-low-memory-hook.cjs \
            -e BOOKORBIT_HA_LOW_MEMORY_MODE=true \
            -e BOOKORBIT_HA_SAFE_SCAN_MB=25 \
            -v "$PWD/bookorbit/test-low-memory-hook.cjs:/tmp/test-low-memory-hook.cjs:ro" \
            --entrypoint node \
            bookorbit-ha-publish-test \
            /tmp/test-low-memory-hook.cjs

      - name: Runtime smoke test
        run: |
          set -eu
          docker run -d --name bookorbit-ha-publish-smoke -p 13001:3000 bookorbit-ha-publish-test
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:13001/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' bookorbit-ha-publish-smoke 2>/dev/null | grep -q true; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "BookOrbit did not become healthy."
            docker logs bookorbit-ha-publish-smoke || true
            exit 1
          fi
          docker logs bookorbit-ha-publish-smoke

      - name: Stop publish smoke-test container
        if: always()
        run: docker rm -f bookorbit-ha-publish-smoke >/dev/null 2>&1 || true

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 + arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ./bookorbit
          file: ./bookorbit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/russellstokes-ai/book-orbit-ha:${{ steps.version.outputs.value }}
            ghcr.io/russellstokes-ai/book-orbit-ha:latest
          labels: |
            org.opencontainers.image.source=https://github.com/russellstokes-ai/book-orbit-HA
            org.opencontainers.image.description=BookOrbit Home Assistant add-on image
            org.opencontainers.image.licenses=MIT

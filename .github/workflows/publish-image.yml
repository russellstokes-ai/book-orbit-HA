name: Build and publish Home Assistant image

on:
  push:
    branches:
      - main
    paths:
      - "bookorbit/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-bookorbit-ha
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version="$(python - <<'PY'
          import yaml
          with open('bookorbit/config.yaml', encoding='utf-8') as f:
              print(yaml.safe_load(f)['version'])
          PY
          )"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 + arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ./bookorbit
          file: ./bookorbit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/russellstokes-ai/book-orbit-ha:${{ steps.version.outputs.value }}
            ghcr.io/russellstokes-ai/book-orbit-ha:latest
          labels: |
            org.opencontainers.image.source=https://github.com/russellstokes-ai/book-orbit-HA
            org.opencontainers.image.description=BookOrbit Home Assistant add-on image
            org.opencontainers.image.licenses=MIT

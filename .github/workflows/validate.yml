name: Validate Home Assistant add-on

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n bookorbit/run.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bookorbit
      - name: Validate YAML
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          for p in [pathlib.Path('repository.yaml'), pathlib.Path('bookorbit/config.yaml')]:
              with p.open('r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('OK', p)
          PY
      - name: Build add-on container
        run: docker build --pull --tag bookorbit-ha-test ./bookorbit

      - name: Verify Pi-safe large-file hook
        run: |
          set -eu
          docker run --rm --entrypoint sh bookorbit-ha-test -c '
            set -eu
            truncate -s 30M /tmp/ha-large.pdf
            truncate -s 30M /tmp/ha-large.cbr
            NODE_OPTIONS="--require=/app/ha-low-memory-hook.cjs" \
            BOOKORBIT_HA_LOW_MEMORY_MODE=true \
            BOOKORBIT_HA_SAFE_SCAN_MB=25 \
            node - <<"NODE"
            (async () => {
              const pdf = require("/app/dist/modules/metadata/lib/pdf-parser.js");
              const cbx = require("/app/dist/modules/metadata/lib/cbz-metadata.js");
              const cbrCover = require("/app/dist/modules/metadata/lib/cover-cbr.js");
              if (!pdf.__haLowMemoryPatched) throw new Error("PDF parser hook not attached");
              if (!cbx.__haLowMemoryPatched) throw new Error("comic metadata hook not attached");
              if (!cbrCover.__haLowMemoryPatched) throw new Error("CBR cover hook not attached");
              const parsed = await pdf.parsePdfFile("/tmp/ha-large.pdf");
              if (!parsed || parsed.coverBuffer !== null) throw new Error("large PDF safe path failed");
              const meta = await cbx.extractCbrMetadata("/tmp/ha-large.cbr");
              const cover = await cbrCover.extractCbrCover("/tmp/ha-large.cbr");
              if (meta !== null || cover !== null) throw new Error("large CBR safe path failed");
              console.log("Pi-safe large-file hook verified");
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
            NODE
          '

      - name: Runtime smoke test
        run: |
          set -eu
          docker run -d --name bookorbit-ha-smoke -p 13000:3000 bookorbit-ha-test
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:13000/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' bookorbit-ha-smoke 2>/dev/null | grep -q true; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "BookOrbit did not become healthy."
            docker logs bookorbit-ha-smoke || true
            exit 1
          fi
          docker logs bookorbit-ha-smoke

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f bookorbit-ha-smoke >/dev/null 2>&1 || true

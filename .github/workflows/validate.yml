name: Validate Home Assistant add-on

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n bookorbit/run.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bookorbit
      - name: Validate YAML
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          for p in [pathlib.Path('repository.yaml'), pathlib.Path('bookorbit/config.yaml')]:
              with p.open('r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('OK', p)
          PY
      - name: Build add-on container
        run: docker build --pull --tag bookorbit-ha-test ./bookorbit

      - name: Verify Pi-safe large-file hook
        run: |
          set -eu
          docker run --rm \
            -e NODE_OPTIONS=--require=/app/ha-low-memory-hook.cjs \
            -e BOOKORBIT_HA_LOW_MEMORY_MODE=true \
            -e BOOKORBIT_HA_SAFE_SCAN_MB=25 \
            -v "$PWD/bookorbit/test-low-memory-hook.cjs:/tmp/test-low-memory-hook.cjs:ro" \
            --entrypoint node \
            bookorbit-ha-test \
            /tmp/test-low-memory-hook.cjs

      - name: Runtime smoke test
        run: |
          set -eu
          docker run -d --name bookorbit-ha-smoke -p 13000:3000 bookorbit-ha-test
          ready=false
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:13000/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' bookorbit-ha-smoke 2>/dev/null | grep -q true; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "BookOrbit did not become healthy."
            docker logs bookorbit-ha-smoke || true
            exit 1
          fi
          docker logs bookorbit-ha-smoke

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f bookorbit-ha-smoke >/dev/null 2>&1 || true

name: Build BookOrbit Android diagnostic APK

on:
  push:
    branches:
      - main
    paths:
      - "android-diagnostic/**"
      - ".github/workflows/bookorbit-android-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout diagnostic patches
        uses: actions/checkout@v4

      - name: Checkout BookOrbit Android v0.4.0
        uses: actions/checkout@v4
        with:
          repository: deranjer/bookorbit-android
          ref: v0.4.0
          path: android-src

      - name: Apply diagnostic patch
        run: |
          set -eu
          cp android-diagnostic/SessionManager.kt \
            android-src/app/src/main/java/com/bookorbit/core/auth/SessionManager.kt
          cp android-diagnostic/ServerSetupViewModel.kt \
            android-src/app/src/main/java/com/bookorbit/feature/auth/ServerSetupViewModel.kt
          cp android-diagnostic/ServerSetupScreen.kt \
            android-src/app/src/main/java/com/bookorbit/feature/auth/ServerSetupScreen.kt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build diagnostic APK
        working-directory: android-src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --no-daemon

      - name: Rename diagnostic APK
        run: |
          cp android-src/app/build/outputs/apk/full/debug/app-full-debug.apk \
            BookOrbit-0.4.0-diagnostic.apk

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: BookOrbit-0.4.0-diagnostic
          path: BookOrbit-0.4.0-diagnostic.apk
          if-no-files-found: error
          retention-days: 7

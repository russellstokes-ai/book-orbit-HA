<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<title>Flipper Phone</title>
<style>
:root{color-scheme:dark;--amber:#ff8200;--paper:#f1ede7;--bg:#090a0d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--paper)}
body{font:600 14px/1.2 system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(100%,420px);min-height:100dvh;margin:auto;padding:13px 17px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:17px;background:linear-gradient(130deg,#0d0e12,#090a0d)}
.statusbar{height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.statusleft,.statusright,.statuspiece{display:flex;align-items:center;gap:7px}
.statusleft{gap:12px}
.statuspiece{color:#d0d0d2;font:800 11px/1.1 ui-monospace,Consolas,monospace}
.statuspiece svg{display:block;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2}
.bars{display:flex;align-items:flex-end;gap:2px;height:16px}
.bars i{display:block;width:3px;border-radius:1px;background:#45464d}
.bars i.on{background:var(--amber)}
#cellText{font:800 11px/1 monospace;color:#eee}
#cellText[hidden]{display:none}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.battery{width:24px;height:13px;border:1.7px solid #a5a5a9;border-radius:2px;position:relative}
.battery:after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;border-radius:0 2px 2px 0;background:#aaa}
.battery:before{content:"";position:absolute;left:2px;top:2px;width:var(--battery-pct,0%);height:7px;background:var(--amber)}
.battery.charging{border-color:#b9eac3}
.brand{height:49px;display:flex;justify-content:flex-start;align-items:center;gap:9px}
.brandtext{display:flex;align-items:center;gap:8px;min-width:0}
.brandlogo{width:138px;height:auto;aspect-ratio:105/12;object-fit:contain;image-rendering:auto;filter:brightness(1.06)}
.brandword{font:italic 900 27px/1 Impact,"Arial Black",system-ui,sans-serif;letter-spacing:-.065em;transform:skewX(-9deg);color:var(--amber)}
.logofallback{display:none;color:var(--amber);font:italic 900 28px/1 Impact,"Arial Black",sans-serif;letter-spacing:-.06em}
.brandtext.logo-failed .brandlogo{display:none}
.brandtext.logo-failed .logofallback{display:inline}
.dolphinwrap,.lcd{width:100%;border:0;box-shadow:none;padding:0;background:transparent}
#dolphin{display:block;width:100%;height:auto;aspect-ratio:256/144;image-rendering:pixelated;border:0;border-radius:10px;background:var(--amber)}
#panel{display:block;width:100%;height:auto;aspect-ratio:256/144;image-rendering:pixelated;border-radius:10px;touch-action:none;background:var(--amber);cursor:pointer}
#panel:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
.tools{display:flex;flex-direction:column;gap:14px}
.navrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.softrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
button{appearance:none;display:grid;place-items:center;min-width:0;touch-action:manipulation;cursor:pointer;border-radius:13px;background:#191b20;border:1.5px solid #424650;color:var(--paper)}
.navrow button{height:59px}
.navrow button.active{background:var(--amber);color:#0d0e10;border-color:#ff9f45}
.navrow button.ptt{color:#e9e6e1}
.softrow button{height:51px;border-color:#b85e13;color:var(--amber);background:#141518}
button svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.softrow button svg{width:25px;height:25px}
button:active{filter:brightness(1.18);transform:translateY(1px)}
button:focus-visible{outline:2px solid white;outline-offset:3px}
#openMenu{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
#runtimeStatus,#message,#modeLabel,#dolphinCaption{display:none}
@media(min-width:700px){main{margin-top:8px;min-height:844px;max-height:900px;border:1px solid #27292b;border-radius:20px}}
@media(max-height:750px){main{gap:11px}.tools{gap:10px}.navrow button{height:52px}.softrow button{height:44px}.brand{height:40px}.brandlogo{width:122px}}
</style>
</head>
<body>
<main>
  <div class="statusbar" role="status" aria-label="Actual Linux host connectivity">
    <div class="statusleft">
      <div class="statuspiece" id="wifiStatus" aria-label="Wi-Fi connection status">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8c5.5-5 14.5-5 20 0M5 11c4-3.5 10-3.5 14 0M9 15c1.8-1.7 4.2-1.7 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
        <span id="wifiText" class="sr-only">Wi-Fi unknown</span><span class="bars" id="wifiBars" aria-hidden="true"></span>
      </div>
      <div class="statuspiece" id="cellStatus" aria-label="Cellular connection status">
        <span id="cellText" hidden></span><span class="bars" id="cellBars" aria-hidden="true"></span>
      </div>
    </div>
    <div class="statusright"><span id="batteryText" class="sr-only">Battery unavailable</span><span id="batteryIcon" class="battery" aria-hidden="true"></span></div>
  </div>
  <header class="brand">
    <div class="brandtext" id="brandtext">
      <img class="brandlogo" id="flipperLogo" src="https://cdn.flipper.net/orange_text_transparent.svg" onerror="document.querySelector('#brandtext').classList.add('logo-failed')" alt="Flipper">
      <span class="logofallback" aria-hidden="true">Flipper</span>
      <span class="brandword">Phone</span>
    </div>
  </header>
  <section class="dolphinwrap" aria-label="Official stock Flipper Zero Dolphin animation">
    <canvas id="dolphin" width="256" height="144" role="img" aria-label="Original Dolphin animation"></canvas>
    <span id="dolphinCaption" aria-hidden="true"></span>
  </section>
  <section class="lcd" aria-label="Native Flipper One interface">
    <canvas id="panel" width="256" height="144" tabindex="0" role="img" aria-label="Live Flipper One screen. Tap to open menu or select an item."></canvas>
  </section>
  <button id="openMenu" tabindex="-1" aria-hidden="true">Menu</button>
  <span id="modeLabel"></span><span id="runtimeStatus"></span><span id="message" role="status"></span>
  <nav class="tools" aria-label="Flipper One touch controls">
    <div class="navrow">
      <button id="btnBack" aria-label="Back" title="Back"><svg viewBox="0 0 24 24"><path d="M7 8.4A8 8 0 0 1 20 12a7.5 7.5 0 0 1-7.5 7.5H9"/><path d="M10 4 4 10l6 6"/></svg></button>
      <button id="btnApps" aria-label="Application switcher" title="Apps"><svg viewBox="0 0 24 24"><rect x="3.5" y="8" width="12.5" height="10.5" rx="1"/><path d="M8 5h12v10.5"/></svg></button>
      <button id="btnSelect" class="active" aria-label="OK Select" title="OK"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></svg></button>
      <button id="btnPtt" class="ptt" aria-label="Push to talk, hold" title="PTT"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M9 4v16M12 8v8M15 4v16M18 6v12M21 9v6"/></svg></button>
    </div>
    <div class="softrow">
      <button data-key="esc" aria-label="Escape" title="Escape"><svg viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></svg></button>
      <button data-key="view" aria-label="View" title="View"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
      <button data-key="power" aria-label="Power" title="Power"><svg viewBox="0 0 24 24"><path d="M12 2v10m-6-7a10 10 0 1 0 12 0"/></svg></button>
      <button data-key="edit" aria-label="Edit" title="Edit"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button data-key="run" aria-label="Run" title="Run"><svg viewBox="0 0 24 24"><path d="m4 12 5.5 5.5L20 6"/></svg></button>
    </div>
  </nav>
</main>
<script src="remote.js"></script>
<script>/* NATIVE_TOUCH_ADAPTER */</script>
<script>/* ORIGINAL_DOLPHIN_CATALOG */</script>
<script>/* NATIVE_PHONE_SHELL_JS */</script>
</body>
</html>
